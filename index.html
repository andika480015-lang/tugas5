<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tugas 5 - Tabel Angka 1-100</title>
<style>
  body { font-family: "Times New Roman", serif; }
  h1 { text-align: center; font-size: 20px; }
  table#tabel { margin: 0 auto; border-collapse: collapse; }
  table#tabel td {
    border: 1px solid #999; width: 28px; height: 28px;
    text-align: center; font-size: 11px; padding: 2px;
  }
  .merah  { background: #e8352a; cursor: pointer; }
  .kuning { background: #ffff33; cursor: pointer; }
  .aqua   { background: #70fbff; cursor: pointer; }
  .hijau  { background: #2e7d1e; cursor: pointer; }
  #formArea { max-width: 900px; margin: 30px auto; }
  fieldset { padding: 10px 14px; }
  fieldset p { margin: 10px 0; }
  textarea { vertical-align: top; }
</style>
</head>
<body>

<h1>TABEL ANGKA 1-100</h1>

<table id="tabel">
  <tr>
    <td>1</td><td>2</td><td>3</td>
    <td class="merah" colspan="5" rowspan="2" data-form="login">1</td>
    <td>9</td><td>10</td>
  </tr>
  <tr>
    <td class="kuning" colspan="2" rowspan="4" data-form="contact">2</td>
    <td>13</td><td>19</td><td>20</td>
  </tr>
  <tr>
    <td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td>
  </tr>
  <tr>
    <td>33</td><td>34</td><td>35</td><td>36</td><td>37</td><td>38</td>
    <td class="hijau" rowspan="4" data-form="url">3</td>
    <td>40</td>
  </tr>
  <tr>
    <td>43</td><td>44</td><td>45</td><td>46</td><td>47</td><td>48</td><td>50</td>
  </tr>
  <tr>
    <td>51</td><td>52</td><td>53</td><td>54</td>
    <td class="aqua" colspan="3" rowspan="3" data-form="pendaftaran">4</td>
    <td>58</td><td>60</td>
  </tr>
  <tr>
    <td>61</td><td>62</td><td>63</td><td>64</td><td>68</td><td>70</td>
  </tr>
  <tr>
    <td>71</td><td>72</td><td>73</td><td>74</td><td>78</td><td>79</td><td>80</td>
  </tr>
  <tr>
    <td>81</td><td>82</td><td>83</td><td>84</td><td>85</td><td>86</td><td>87</td><td>88</td><td>89</td><td>90</td>
  </tr>
  <tr>
    <td>91</td><td>92</td><td>93</td><td>94</td><td>95</td><td>96</td><td>97</td><td>98</td><td>99</td><td>100</td>
  </tr>
</table>

<div id="formArea"></div>

<script>
const forms = {
  login: `
    <h2>Form Login</h2>
    <form>
      <fieldset>
        <legend>Login</legend>
        <p>Username: <input type="text" placeholder="Masukkan username"></p>
        <p>Password: <input type="password" placeholder="Masukkan password"></p>
        <p><label><input type="checkbox"> Remember me</label></p>
        <p><button type="submit">Login</button> <button type="reset">Reset</button></p>
      </fieldset>
    </form>`,

  contact: `
    <h2>Form Contact</h2>
    <form>
      <fieldset>
        <legend>Contact</legend>
        <p>Nama: <input type="text" placeholder="Masukkan nama"></p>
        <p>Email: <input type="email" placeholder="Masukkan email"></p>
        <p>Subject: <input type="text" placeholder="Masukkan subject"></p>
        <p>Pesan:<br><textarea rows="5" cols="45" placeholder="Tulis pesan Anda..."></textarea></p>
        <p><button type="submit">Send</button> <button type="reset">Reset</button></p>
      </fieldset>
    </form>`,

  pendaftaran: `
    <h2>Form Pendaftaran</h2>
    <form>
      <fieldset>
        <legend>Pendaftaran Siswa</legend>
        <p>Nama Lengkap: <input type="text" placeholder="Masukkan nama lengkap"></p>
        <p>NIS: <input type="text" placeholder="Masukkan NIS"></p>
        <p>Jenis Kelamin:
          <label><input type="radio" name="jk" value="L"> Laki-laki</label>
          <label><input type="radio" name="jk" value="P"> Perempuan</label>
        </p>
        <p>Tanggal Lahir: <input type="date"></p>
        <p>Jurusan:
          <select>
            <option value="">-- Pilih Jurusan --</option>
            <option>RPL</option>
            <option>TKJ</option>
            <option>Multimedia</option>
            <option>Akuntansi</option>
          </select>
        </p>
        <p>Alamat:<br><textarea rows="4" cols="40" placeholder="Masukkan alamat lengkap"></textarea></p>
        <p>Foto: <input type="file" accept="image/*"></p>
        <p><label><input type="checkbox"> Saya menyetujui data yang saya masukkan</label></p>
        <p><button type="submit">Daftar</button> <button type="reset">Reset</button></p>
      </fieldset>
    </form>`,

  url: `
    <h2>Form URL</h2>
    <form>
      <fieldset>
        <legend>URL</legend>
        <p>URL: <input type="url" placeholder="Masukkan URL"></p>
        <p>Tanggal: <input type="date"></p>
        <p>Waktu: <input type="time"></p>
        <p>Jumlah: <input type="number"></p>
        <p><button type="submit">Send</button> <button type="reset">Reset</button></p>
      </fieldset>
    </form>`
};

document.querySelectorAll('#tabel td[data-form]').forEach(td => {
  td.addEventListener('click', () => {
    document.getElementById('formArea').innerHTML = forms[td.dataset.form];
    document.getElementById('formArea').scrollIntoView({ behavior: 'smooth' });
  });
});
</script>

</body>
  </html>
